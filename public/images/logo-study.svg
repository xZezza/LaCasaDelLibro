<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1390 820"><rect width="1390" height="820" fill="#f8f6ef"/><text x="42" y="49" font-family="Arial,sans-serif" font-size="10" letter-spacing="3" fill="#7e8b72">THE SALON / STUDIO DEL LOGO</text><text x="40" y="107" font-family="Georgia,serif" font-size="42" fill="#304f40">Tre modi per entrare nel tuo mondo di lettura.</text><text x="42" y="139" font-family="Arial,sans-serif" font-size="13" fill="#7e8b72">Proposte esplorative vettoriali. Tipografia e proporzioni da affinare prima del marchio definitivo.</text><g><rect x="40" y="178" width="418" height="520" rx="18" fill="#eef1e6" stroke="#b6c3aa"/><text x="67" y="218" font-family="Arial,sans-serif" font-size="10" fill="#79856f" letter-spacing="2">01 / THE STORY PORTAL</text><svg x="194" y="278" width="110" height="110" viewBox="0 0 100 100" color="#304f40"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M24 63V38a26 26 0 0 1 52 0v25"/><path d="M11 61q20-5 39 9 19-14 39-9v25q-20-5-39 8-19-13-39-8Z"/><path d="M50 70v24"/><path d="m50 30 3.7 9.3L63 43l-9.3 3.7L50 56l-3.7-9.3L37 43l9.3-3.7Z" stroke-width="1.8"/></g></svg><text x="249" y="459" text-anchor="middle" font-family="Georgia,serif" font-size="43" fill="#304f40">The Salon</text><text x="249" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#849077" letter-spacing="2.5">A LITTLE WORLD FOR YOUR READING LIFE</text><path d="M214 523h70" stroke="#cbd2bf"/><text x="249" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#7a866f">Un libro aperto diventa una porta.</text><text x="249" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#7a866f">Lettura, scoperta e mondi da abitare.</text><svg x="200" y="627" width="24" height="24" viewBox="0 0 100 100" color="#304f40"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M24 63V38a26 26 0 0 1 52 0v25"/><path d="M11 61q20-5 39 9 19-14 39-9v25q-20-5-39 8-19-13-39-8Z"/><path d="M50 70v24"/><path d="m50 30 3.7 9.3L63 43l-9.3 3.7L50 56l-3.7-9.3L37 43l9.3-3.7Z" stroke-width="1.8"/></g></svg><svg x="274" y="627" width="24" height="24" viewBox="0 0 100 100" color="#222820"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M24 63V38a26 26 0 0 1 52 0v25"/><path d="M11 61q20-5 39 9 19-14 39-9v25q-20-5-39 8-19-13-39-8Z"/><path d="M50 70v24"/><path d="m50 30 3.7 9.3L63 43l-9.3 3.7L50 56l-3.7-9.3L37 43l9.3-3.7Z" stroke-width="1.8"/></g></svg><rect x="289" y="198" width="140" height="26" rx="13" fill="#4d6653"/><text x="359" y="215" text-anchor="middle" fill="#fffdf2" font-family="Arial,sans-serif" font-size="9">DIREZIONE CONSIGLIATA</text></g><g><rect x="486" y="178" width="418" height="520" rx="18" fill="#fdfbf6" stroke="#dedfd1"/><text x="513" y="218" font-family="Arial,sans-serif" font-size="10" fill="#79856f" letter-spacing="2">02 / THE BOTANICAL MONOGRAM</text><svg x="640" y="278" width="110" height="110" viewBox="0 0 100 100" color="#304f40"><text x="15" y="75" font-family="Georgia,serif" font-size="76" fill="currentColor">T</text><text x="43" y="88" font-family="Georgia,serif" font-size="66" fill="currentColor">S</text><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M24 89Q13 57 38 20"/><path d="M28 38Q10 31 17 21q15 2 11 17Z"/><path d="M31 31Q30 13 43 13q1 13-12 18Z"/></g></svg><text x="695" y="459" text-anchor="middle" font-family="Georgia,serif" font-size="43" fill="#304f40">The Salon</text><text x="695" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#849077" letter-spacing="2.5">A LITTLE WORLD FOR YOUR READING LIFE</text><path d="M660 523h70" stroke="#cbd2bf"/><text x="695" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#7a866f">Le iniziali TS con un piccolo germoglio.</text><text x="695" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#7a866f">Una firma sobria e riconoscibile.</text><svg x="646" y="627" width="24" height="24" viewBox="0 0 100 100" color="#304f40"><text x="15" y="75" font-family="Georgia,serif" font-size="76" fill="currentColor">T</text><text x="43" y="88" font-family="Georgia,serif" font-size="66" fill="currentColor">S</text><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M24 89Q13 57 38 20"/><path d="M28 38Q10 31 17 21q15 2 11 17Z"/><path d="M31 31Q30 13 43 13q1 13-12 18Z"/></g></svg><svg x="720" y="627" width="24" height="24" viewBox="0 0 100 100" color="#222820"><text x="15" y="75" font-family="Georgia,serif" font-size="76" fill="currentColor">T</text><text x="43" y="88" font-family="Georgia,serif" font-size="66" fill="currentColor">S</text><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M24 89Q13 57 38 20"/><path d="M28 38Q10 31 17 21q15 2 11 17Z"/><path d="M31 31Q30 13 43 13q1 13-12 18Z"/></g></svg></g><g><rect x="932" y="178" width="418" height="520" rx="18" fill="#fdfbf6" stroke="#dedfd1"/><text x="959" y="218" font-family="Arial,sans-serif" font-size="10" fill="#79856f" letter-spacing="2">03 / THE ENCHANTED BOOKMARK</text><svg x="1086" y="278" width="110" height="110" viewBox="0 0 100 100" color="#304f40"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M30 14h40v76L50 76 30 90Z"/><path d="M36 21h28" stroke-width="1.2"/><path d="m50 32 4.5 11.5L66 48l-11.5 4.5L50 64l-4.5-11.5L34 48l11.5-4.5Z" stroke-width="1.8"/><circle cx="61" cy="30" r="1.3" fill="currentColor" stroke="none"/></g></svg><text x="1141" y="459" text-anchor="middle" font-family="Georgia,serif" font-size="43" fill="#304f40">The Salon</text><text x="1141" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#849077" letter-spacing="2.5">A LITTLE WORLD FOR YOUR READING LIFE</text><path d="M1106 523h70" stroke="#cbd2bf"/><text x="1141" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#7a866f">Un segnalibro custodisce una stella.</text><text x="1141" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#7a866f">Il diario e ciò che resta di una storia.</text><svg x="1092" y="627" width="24" height="24" viewBox="0 0 100 100" color="#304f40"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M30 14h40v76L50 76 30 90Z"/><path d="M36 21h28" stroke-width="1.2"/><path d="m50 32 4.5 11.5L66 48l-11.5 4.5L50 64l-4.5-11.5L34 48l11.5-4.5Z" stroke-width="1.8"/><circle cx="61" cy="30" r="1.3" fill="currentColor" stroke="none"/></g></svg><svg x="1166" y="627" width="24" height="24" viewBox="0 0 100 100" color="#222820"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M30 14h40v76L50 76 30 90Z"/><path d="M36 21h28" stroke-width="1.2"/><path d="m50 32 4.5 11.5L66 48l-11.5 4.5L50 64l-4.5-11.5L34 48l11.5-4.5Z" stroke-width="1.8"/><circle cx="61" cy="30" r="1.3" fill="currentColor" stroke="none"/></g></svg></g><text x="42" y="756" font-family="Arial,sans-serif" font-size="12" fill="#7d8971">Palette di studio: verde bosco · salvia · avorio. Ogni simbolo funziona anche in un solo colore.</text><text x="42" y="785" font-family="Arial,sans-serif" font-size="11" fill="#8e9784">Il libro-portale lega la libreria al diario e alla scoperta delle saghe, senza dipendere dallo scenario invernale.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1355" height="1161" viewBox="0 0 1355 1161">
  <!-- Non-visible filter control map: neutral green keeps vertical coordinates fixed.
       Red displacement fades to neutral before the journal edge (y=325). -->
  <defs>
    <linearGradient id="stem" x1="0" y1="75" x2="0" y2="325" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgb(255,128,128)"/>
      <stop offset=".45" stop-color="rgb(218,128,128)"/>
      <stop offset="1" stop-color="rgb(128,128,128)"/>
    </linearGradient>
    <linearGradient id="edge" x1="510" y1="0" x2="645" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="bouquet"><rect width="645" height="325" fill="url(#edge)"/></mask>
  </defs>
  <rect width="1355" height="1161" fill="rgb(128,128,128)"/>
  <rect width="645" height="325" fill="url(#stem)" mask="url(#bouquet)"/>
</svg>
